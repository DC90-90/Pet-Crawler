##############################################
# Daleel Pets — docker-compose.yml
# MongoDB + FastAPI Backend + React Frontend + Nginx Reverse Proxy
#
# Usage:
#   cp .env.example .env    # Fill in your values
#   docker compose up -d --build
#   docker compose logs -f
#
# Architecture:
#   Client → :80/:443 (nginx) → /api/* → :8001 (backend)
#                               → /*     → :3000 (frontend)
#   Backend → MongoDB :27017
#   Crawler runs FROM backend container (no proxy)
##############################################

services:

  # ── MongoDB ────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: daleel-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:?DB_NAME required}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend + Crawler ──────────────────
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: daleel-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: ${MONGO_URL:?MONGO_URL required}
      DB_NAME: ${DB_NAME:?DB_NAME required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      CRAWLER_TOKEN: ${CRAWLER_TOKEN:-}
      ZID_API_TOKEN: ${ZID_API_TOKEN:-}
      ZID_STORE_ID: ${ZID_STORE_ID:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL required}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS required}
      WEBHOOK_CRON_SECRET: ${WEBHOOK_CRON_SECRET:?WEBHOOK_CRON_SECRET required}
      SEED_DEMO_DATA: "false"
      PLAYWRIGHT_BROWSERS_PATH: /pw-browsers
    ports:
      - "127.0.0.1:8001:8001"
    # Crawler needs direct internet — no proxy
    # DNS must resolve Saudi store domains directly
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── React Frontend ─────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:?REACT_APP_BACKEND_URL required}
    container_name: daleel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  # ── Nginx Reverse Proxy ────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: daleel-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local
  nginx_logs:
    driver: local
